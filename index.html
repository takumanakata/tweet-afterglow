<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Tweet Afterglow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --panel: #161616; --line: #2a2a2a; --fg: #e8e8e8; --dim: #8a8a8a; --dim2: #555;
    --keep: #2ecc71; --del: #ff5c5c; --skip: #555; --accent: #1d9bf0; --warn: #ffb700;
  }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif; line-height: 1.5; }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  a { color: var(--accent); }
  code { background: #222; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; display: flex; align-items: center; gap: 10px; }
  h2 .num { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #2a2a2a; color: #ccc; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  h2 .num.done { background: var(--keep); color: #042; }
  p.hint { color: var(--dim); font-size: 13px; }

  .top { position: sticky; top: 0; z-index: 50; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top .title { font-weight: 700; font-size: 16px; }
  .top .tagline { color: var(--dim); font-size: 12px; }
  .top .spacer { flex: 1; }
  .counts { display: flex; gap: 6px; font-size: 12px; }
  .counts span { background: #1f1f1f; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
  .counts b.k { color: var(--keep); } .counts b.d { color: var(--del); } .counts b.s { color: var(--dim); }
  .lang button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .lang button.on { color: #fff; border-color: #666; }

  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 120px; }
  section.step { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  section.step.locked { opacity: .45; pointer-events: none; }
  section.step > h2 { margin-bottom: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .btn { background: #222; border: 1px solid #3a3a3a; color: #eee; border-radius: 10px; padding: 8px 14px; font-size: 14px; }
  .btn:hover:not(:disabled) { background: #2a2a2a; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.good { background: var(--keep); border-color: var(--keep); color: #042; font-weight: 700; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.ok { background: #1a5e38; border-color: #1a5e38; color: #fff; }
  label.field { display: block; margin: 12px 0; }
  label.field > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  input[type=text], input[type=date], input[type=number], textarea, select {
    width: 100%; background: #0f0f0f; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; color: #fff; outline: none;
  }
  input[type=number] { width: 90px; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
  textarea.rubric { min-height: 160px; font-size: 13px; }
  input[type=file] { display: none; }
  .note { background: #1b1b1b; border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 13px; color: #ccc; margin: 10px 0; }
  .note.warn { border-color: var(--warn); }
  .note.priv { border-color: var(--keep); }
  .pill { display: inline-block; background: #222; border-radius: 10px; padding: 1px 8px; font-size: 12px; color: #bbb; }

  /* pivot picker */
  .picker { max-height: 260px; overflow: auto; border: 1px solid #2a2a2a; border-radius: 8px; margin-top: 6px; }
  .picker div { padding: 7px 10px; border-bottom: 1px solid #1f1f1f; font-size: 13px; cursor: pointer; display: flex; gap: 10px; }
  .picker div:hover { background: #1f1f1f; }
  .picker div .d { color: var(--dim); flex: none; }
  .picker div.sel { background: #10301c; }
  .pivot-now { margin-top: 8px; font-size: 13px; padding: 8px 10px; background: #0f0f0f; border-radius: 8px; border: 1px solid #2a2a2a; }

  /* rule stats */
  table.stats { border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  table.stats td { padding: 3px 12px 3px 0; color: #ccc; }
  table.stats td:first-child { color: var(--dim); }

  /* batches */
  .batches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .batch { border: 1px solid #333; border-radius: 10px; padding: 8px 10px; font-size: 13px; cursor: pointer; background: #1b1b1b; }
  .batch.sel { border-color: var(--accent); }
  .batch.done { border-color: var(--keep); color: var(--keep); }
  .batch small { display: block; color: var(--dim); font-size: 11px; }
  .pastebox { min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }

  /* review */
  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
  .stat { background: #1f1f1f; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .stat b { font-size: 14px; margin-left: 4px; }
  .stat.keep b { color: var(--keep); } .stat.delete b { color: var(--del); } .stat.skip b { color: var(--dim); }
  .stat.on { border-color: var(--accent); }
  .yearbar { display: flex; gap: 3px; align-items: flex-end; height: 44px; margin: 4px 0 14px; }
  .yearbar div { flex: 1; background: #2a2a2a; position: relative; border-radius: 2px 2px 0 0; cursor: pointer; }
  .yearbar div i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--keep); border-radius: 2px 2px 0 0; }
  .yearbar div span { position: absolute; top: 100%; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--dim); }
  .yearbar div.on { outline: 1px solid var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .controls input[type=text] { flex: 1; min-width: 160px; }
  .controls select { width: auto; }
  .tweet { background: #121212; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; }
  .tweet.keep { border-left: 4px solid var(--keep); }
  .tweet.delete { border-left: 4px solid #5a2a2a; }
  .tweet.skip { border-left: 4px solid var(--skip); opacity: .7; }
  .tweet.overridden { outline: 1px dashed var(--accent); }
  .meta { font-size: 11px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meta .cat { background: #222; border-radius: 10px; padding: 1px 8px; color: #bbb; }
  .meta .cat.k { color: var(--keep); } .meta .cat.lock { color: var(--warn); }
  .meta .reason { color: #9c9; }
  .meta a { color: var(--dim); text-decoration: none; } .meta a:hover { color: var(--accent); }
  .text { font-size: 14px; white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
  .text a { text-decoration: none; }
  .text mark { background: #3a3a00; color: #ffe; border-radius: 2px; }
  .act { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .act button { border: 1px solid #333; background: #1f1f1f; color: #ccc; border-radius: 8px; padding: 6px 12px; font-size: 12px; min-width: 76px; }
  .act button.on-keep { background: var(--keep); color: #042; border-color: var(--keep); font-weight: 700; }
  .act button.on-del  { background: #5a2a2a; color: #fdd; border-color: #7a3a3a; font-weight: 700; }
  .pager { display: flex; justify-content: center; gap: 8px; align-items: center; margin: 14px 0; font-size: 13px; color: var(--dim); }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  ol.steps { padding-left: 22px; font-size: 14px; }
  ol.steps li { margin: 6px 0; }
  kbd { background: #222; border: 1px solid #444; border-radius: 4px; padding: 0 6px; font-size: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid #444; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 200; max-width: 90vw; }
  footer { text-align: center; color: var(--dim2); font-size: 12px; padding: 30px 0; }
</style>
</head>
<body>

<div class="top">
  <span class="title">Tweet Afterglow</span>
  <span class="tagline" data-t="tagline"></span>
  <span class="spacer"></span>
  <span class="counts" id="counts"></span>
  <span class="lang"><button id="langEn" class="on">EN</button> <button id="langJa">日本語</button></span>
</div>

<main>
  <div class="note priv" data-t="privacy"></div>

  <!-- 1. archive -->
  <section class="step" id="s1">
    <h2><span class="num" id="n1">1</span><span data-t="s1_title"></span></h2>
    <p class="hint" data-t="s1_hint"></p>
    <div class="row">
      <label class="btn primary" id="btnFile"><span data-t="s1_btn"></span><input type="file" id="fileTweets" accept=".js,.json"></label>
      <span id="fileInfo" class="pill" style="display:none"></span>
    </div>
  </section>

  <!-- 2. settings -->
  <section class="step locked" id="s2">
    <h2><span class="num" id="n2">2</span><span data-t="s2_title"></span></h2>
    <p class="hint" data-t="s2_hint"></p>

    <label class="field"><span data-t="pivot_label"></span>
      <input type="text" id="pivotSearch" data-ph="pivot_search">
    </label>
    <div class="picker" id="pivotPicker" style="display:none"></div>
    <div class="row">
      <span class="hint" data-t="pivot_or"></span>
      <input type="date" id="pivotDate" style="width:auto">
      <button class="btn small" id="pivotClear" data-t="pivot_clear"></button>
    </div>
    <div class="pivot-now" id="pivotNow"></div>

    <label class="field"><span data-t="blocked_label"></span>
      <textarea id="blocked" data-ph="blocked_ph"></textarea>
    </label>
    <label class="field"><span data-t="profile_label"></span>
      <textarea id="profile" data-ph="profile_ph"></textarea>
    </label>
    <details>
      <summary class="hint" style="cursor:pointer" data-t="advanced"></summary>
      <label class="field"><span data-t="minfav_label"></span><input type="number" id="minFav" min="0" value="3"></label>
      <label class="field"><span data-t="batch_label"></span><input type="number" id="batchSize" min="20" max="500" value="150"></label>
      <label class="field"><span data-t="rubric_label"></span><textarea id="rubric" class="rubric"></textarea></label>
      <button class="btn small" id="rubricReset" data-t="rubric_reset"></button>
    </details>
  </section>

  <!-- 3. rules -->
  <section class="step locked" id="s3">
    <h2><span class="num" id="n3">3</span><span data-t="s3_title"></span></h2>
    <p class="hint" data-t="s3_hint"></p>
    <table class="stats" id="ruleStats"></table>
  </section>

  <!-- 4. AI -->
  <section class="step locked" id="s4">
    <h2><span class="num" id="n4">4</span><span data-t="s4_title"></span></h2>
    <p class="hint" data-t="s4_hint"></p>
    <div class="note warn" data-t="s4_privacy"></div>
    <div class="batches" id="batches"></div>
    <div class="row">
      <button class="btn primary" id="copyBatch" data-t="copy_batch"></button>
      <span id="batchInfo" class="hint"></span>
    </div>
    <label class="field"><span data-t="paste_label"></span>
      <textarea id="pasteBox" class="pastebox" data-ph="paste_ph"></textarea>
    </label>
    <div class="row">
      <button class="btn good" id="applyPaste" data-t="apply_paste"></button>
      <span id="pasteInfo" class="hint"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn small" id="clearAi" data-t="clear_ai"></button>
    </div>
    <p class="hint" data-t="s4_skip"></p>
  </section>

  <!-- 5. review -->
  <section class="step locked" id="s5">
    <h2><span class="num" id="n5">5</span><span data-t="s5_title"></span></h2>
    <p class="hint" data-t="s5_hint"></p>
    <div class="stats-row" id="stats"></div>
    <div class="yearbar" id="yearbar"></div>
    <div class="controls">
      <input type="text" id="q" data-ph="search_ph">
      <select id="cat"></select>
      <select id="src">
        <option value="" data-t="src_all"></option>
        <option value="ai" data-t="src_ai"></option>
        <option value="rule" data-t="src_rule"></option>
        <option value="manual" data-t="src_manual"></option>
      </select>
      <button class="btn small" id="sort"></button>
      <button class="btn small" id="resetOv" data-t="reset_manual"></button>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </section>

  <!-- 6. delete -->
  <section class="step locked" id="s6">
    <h2><span class="num" id="n6">6</span><span data-t="s6_title"></span></h2>
    <div class="row">
      <button class="btn good" id="exportList" data-t="export_list"></button>
      <button class="btn primary" id="copyDeleter" data-t="copy_deleter"></button>
      <a class="btn small" id="dlDeleter" href="deleter.js" download style="text-decoration:none" data-t="dl_deleter"></a>
    </div>
    <ol class="steps" id="deleteSteps"></ol>
    <div class="note" data-t="s6_note"></div>
  </section>

  <footer>
    <span data-t="footer"></span> · <a href="https://github.com/takumanakata/tweet-afterglow">GitHub</a>
  </footer>
</main>
<div id="toast"></div>

const DEFAULT_RUBRIC = `You are helping the author of these tweets decide which old tweets to KEEP and which to DELETE.

About the author:
{{PROFILE}}

Policy: delete everything by default. Keep only achievements and announcements of the author's own work. When unsure, delete. Ask: would this post still be a plus if it stayed public for years?

KEEP categories:
- achievement: being selected, awarded, accepted, interviewed, covered
- announce: the author's own exhibitions, talks, performances, workshops, broadcasts, releases
- work: presenting the author's own finished work with a link, video or image
- milestone: career milestones (new job, going independent, moving abroad, residency start/end)
- press: the author's work featured in an article or interview

DELETE categories:
- reaction: reactions to other people's work, events or news
- share: sharing other people's articles, videos, tools
- casual: daily life, mood, chatter, jokes, food, travel
- wip: work-in-progress notes, tech notes, "got it working"
- opinion: opinions, critique, politics, complaints, resolutions
- event_attend: attending an event as audience
- other: anything else

Notes: "made this" alone is not work; only finished work presented with a title, link, video or venue. Promoting other people's events is share. A high like count alone is not a reason to keep. Anything negative, aggressive, embarrassing, about other people, private, or likely to age badly: delete, even if it is also an achievement. Early posts (student / junior years) deserve a stricter eye. Same standard in every language.`;

const KEYWORDS = /公開|展示|出演|登壇|発表|リリース|受賞|掲載|取材|個展|ワークショップ|出展|開催|発売|選ばれ|受かっ|合格|入選|採択|ノミネート|放送|上映|ローンチ|レジデン|作りました|作った|制作|VJ|ライブ|イベント|フェス|講師|授業|参加|release|exhibit|talk|speak|announce|award|selected|featured|premiere|launch|residen|vimeo\.com|youtu/i;
const AUTO_TEXT = /^I just liked|^I liked a @YouTube|^I uploaded a @YouTube|^I added a video to a @YouTube|\(live at http|^Just posted a photo|^#nowplaying|^Photo: |^Photoset: /i;
const AUTO_SOURCE = new Set(['Vimeo', 'Instagram', 'foursquare', 'Foursquare', 'Swarm', 'Swarm by Foursquare', 'YouTube', 'Tumblr', 'Behance', 'SoundCloud']);
const OLD_QUOTE_RT = /\sRT @\w+:?/;
const KEEP_CATS = new Set(['achievement', 'announce', 'work', 'milestone', 'press']);
const LOCKED = new Set(['recent', 'blocked']);
const TWITTER_EPOCH = 1288834974657n;
const STORE = 'tweetafterglow_v3';

// ─────────────────────────────────────────────────────────────
//  state
// ─────────────────────────────────────────────────────────────
let lang = 'en';
let tweets = [];                // parsed archive
let S = {                       // persisted
  pivotId: null, pivotDate: '', blocked: '', profile: '', minFav: 3, batchSize: 150, rubric: DEFAULT_RUBRIC,
  ai: {},                       // id -> {d, c, r}
  overrides: {},                // id -> 'keep' | 'delete'
};
let rules = new Map();          // id -> {d, c}
let candidates = [];            // tweets going to the AI pass, sorted by id
let selBatch = 0;
let view = { d: 'keep', cat: '', src: '', q: '', year: '', desc: true, page: 0 };
const PAGE = 100;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = k => (T[lang][k] ?? T.en[k] ?? k);
const catName = c => (T[lang].cats[c] ?? T.en.cats[c] ?? c);
function toast(msg) { const x = $('#toast'); x.textContent = msg; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(() => x.style.display = 'none', 3000); }
function save() { try { localStorage.setItem(STORE, JSON.stringify({ lang, S })); } catch (e) { toast('save failed: ' + e.message); } }
function load() {
  try { const o = JSON.parse(localStorage.getItem(STORE) || 'null'); if (o) { lang = o.lang || 'en'; S = { ...S, ...o.S }; } } catch {}
}

// ─────────────────────────────────────────────────────────────
//  tweet helpers
// ─────────────────────────────────────────────────────────────
const text = tw => tw.full_text || tw.text || '';
const source = tw => (tw.source || '').replace(/<[^>]+>/g, '');
const mentions = tw => ((tw.entities || {}).user_mentions || []).map(m => m.screen_name.toLowerCase());
const media = tw => ((tw.extended_entities || {}).media) || ((tw.entities || {}).media) || [];
const urls = tw => [...((tw.entities || {}).urls || []).map(u => u.expanded_url || u.url), ...media(tw).map(m => m.media_url_https || m.media_url)].filter(Boolean);
const fav = tw => +tw.favorite_count || 0;
const rtc = tw => +tw.retweet_count || 0;
const date = tw => new Date(tw.created_at);
const isRT = tw => text(tw).startsWith('RT @');
const isReply = tw => !!(tw.in_reply_to_status_id_str || tw.in_reply_to_user_id_str) || text(tw).startsWith('@');
const isAuto = tw => AUTO_TEXT.test(text(tw)) || AUTO_SOURCE.has(source(tw));
const isQuote = tw => OLD_QUOTE_RT.test(text(tw));
const idLT = (a, b) => BigInt(a) < BigInt(b);
function pivotFromDate(d) { if (!d) return null; const ms = BigInt(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10))); return ((ms - TWITTER_EPOCH) << 22n).toString(); }
function effectivePivot() { return S.pivotId || pivotFromDate(S.pivotDate); }
function blockedSets() {
  const users = new Set(), words = [];
  S.blocked.split('\n').map(s => s.trim()).filter(Boolean).forEach(s => { if (/^@?[A-Za-z0-9_]{1,15}$/.test(s)) users.add(s.replace(/^@/, '').toLowerCase()); words.push(s.replace(/^@/, '')); });
  const re = words.length ? new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'i') : null;
  return { users, re };
}

// ─────────────────────────────────────────────────────────────
//  rules
// ─────────────────────────────────────────────────────────────
function runRules() {
  const pivot = effectivePivot();
  const { users, re } = blockedSets();
  rules = new Map(); candidates = [];
  for (const tw of tweets) {
    let r;
    if (pivot && !idLT(tw.id, pivot)) r = ['skip', 'recent'];
    else if ((users.size && (mentions(tw).some(m => users.has(m)) || users.has((tw.in_reply_to_screen_name || '').toLowerCase()))) || (re && re.test(text(tw)))) r = ['delete', 'blocked'];
    else if (isRT(tw)) r = ['delete', 'retweet'];
    else if (isReply(tw)) r = ['delete', 'reply'];
    else if (isAuto(tw)) r = ['delete', 'auto'];
    else if (isQuote(tw)) r = ['delete', 'quote'];
    else if (KEYWORDS.test(text(tw)) || fav(tw) >= S.minFav || urls(tw).length) { r = ['review', 'candidate']; candidates.push(tw); }
    else r = ['delete', 'casual'];
    rules.set(tw.id, { d: r[0], c: r[1] });
  }
  candidates.sort((a, b) => idLT(a.id, b.id) ? -1 : 1);
}
function decisionOf(tw) {
  const o = S.overrides[tw.id]; if (o) return o;
  const r = rules.get(tw.id);
  if (r.d !== 'review') return r.d;
  const a = S.ai[tw.id];
  return a ? a.d : 'delete';
}
function categoryOf(tw) {
  const r = rules.get(tw.id);
  if (r.d !== 'review') return r.c;
  const a = S.ai[tw.id];
  return a ? a.c : 'candidate';
}

// ─────────────────────────────────────────────────────────────
//  UI: language + static text
// ─────────────────────────────────────────────────────────────
function applyLang() {

  if (tweets.length) renderAll();
}
$('#langEn').onclick = () => { lang = 'en'; save(); applyLang(); };
$('#langJa').onclick = () => { lang = 'ja'; save(); applyLang(); };

// ─────────────────────────────────────────────────────────────
//  step 1: load
// ─────────────────────────────────────────────────────────────
$('#fileTweets').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const raw = await f.text();
    const i = raw.indexOf('['); if (i < 0) throw new Error('no tweet data found');

    $('#btnFile').classList.add('ok'); $('#n1').classList.add('done');

  } catch (err) { toast('could not read tweets.js: ' + err.message); }
};

// ─────────────────────────────────────────────────────────────
//  step 2: settings
// ─────────────────────────────────────────────────────────────
function bindSettings() {
  $('#blocked').value = S.blocked; $('#profile').value = S.profile; $('#minFav').value = S.minFav; $('#batchSize').value = S.batchSize; $('#rubric').value = S.rubric; $('#pivotDate').value = S.pivotDate;
  const onChange = () => { S.blocked = $('#blocked').value; S.profile = $('#profile').value; S.minFav = +$('#minFav').value || 0; S.batchSize = Math.max(20, +$('#batchSize').value || 150); S.rubric = $('#rubric').value; save(); if (tweets.length) renderAll(); };
  ['blocked', 'profile', 'minFav', 'batchSize', 'rubric'].forEach(id => { $('#' + id).addEventListener('change', onChange); });
  $('#rubricReset').onclick = () => { S.rubric = DEFAULT_RUBRIC; $('#rubric').value = S.rubric; save(); };
  $('#pivotDate').onchange = e => { S.pivotDate = e.target.value; S.pivotId = null; save(); renderAll(); };
  $('#pivotClear').onclick = () => { S.pivotId = null; S.pivotDate = ''; $('#pivotDate').value = ''; save(); renderAll(); };
  let qt;
  $('#pivotSearch').oninput = e => { clearTimeout(qt); qt = setTimeout(() => renderPicker(e.target.value.trim().toLowerCase()), 150); };
}
function renderPicker(q) {
  const box = $('#pivotPicker');
  if (!q) { box.style.display = 'none'; return; }
  const hits = tweets.filter(tw => !isRT(tw) && text(tw).toLowerCase().includes(q)).sort((a, b) => idLT(a.id, b.id) ? 1 : -1).slice(0, 60);
  box.style.display = ''; box.innerHTML = '';
  hits.forEach(tw => {
    const d = el('div', tw.id === S.pivotId ? 'sel' : '');
    d.innerHTML = `<span class="d">${date(tw).toISOString().slice(0, 10)}</span><span>${esc(text(tw).slice(0, 120))}</span>`;
    d.onclick = () => { S.pivotId = tw.id; S.pivotDate = ''; $('#pivotDate').value = ''; save(); renderAll(); renderPicker(q); };
    box.appendChild(d);
  });
  if (!hits.length) box.appendChild(el('div', '', t('nothing')));
}
function renderPivot() {
  const p = effectivePivot(); const box = $('#pivotNow');
  if (!p) { box.textContent = t('pivot_none'); return; }
  const n = tweets.filter(tw => idLT(tw.id, p)).length;
  const tw = tweets.find(x => x.id === S.pivotId);
  box.innerHTML = `<b>${t('pivot_set')}</b> ${tw ? `${date(tw).toISOString().slice(0, 10)} — ${esc(text(tw).slice(0, 100))}` : esc(S.pivotDate)} <span class="pill">${n.toLocaleString()} ${t('pivot_scope')}</span>`;
}

// ─────────────────────────────────────────────────────────────
//  step 3: rule stats
// ─────────────────────────────────────────────────────────────
function renderRules() {
  const c = {}; for (const r of rules.values()) c[r.c] = (c[r.c] || 0) + 1;
  const order = ['recent', 'blocked', 'retweet', 'reply', 'auto', 'quote', 'casual', 'candidate'];
  $('#ruleStats').innerHTML = order.filter(k => c[k]).map(k => `<tr><td>${t('r_' + k)}</td><td><b>${c[k].toLocaleString()}</b></td></tr>`).join('');
  $('#n3').classList.toggle('done', tweets.length > 0);
}

// ─────────────────────────────────────────────────────────────
//  step 4: AI pass
// ─────────────────────────────────────────────────────────────
function batches() { const out = []; for (let i = 0; i < candidates.length; i += S.batchSize) out.push(candidates.slice(i, i + S.batchSize)); return out; }
function renderBatches() {
  const bs = batches(); const box = $('#batches'); box.innerHTML = '';
  if (selBatch >= bs.length) selBatch = Math.max(0, bs.length - 1);
  let judgedAll = 0;
  bs.forEach((b, i) => {
    const judged = b.filter(tw => S.ai[tw.id]).length; judgedAll += judged;
    const d = el('div', `batch ${i === selBatch ? 'sel' : ''} ${judged === b.length ? 'done' : ''}`);
    d.innerHTML = `${t('batch_sel')} ${i + 1}<small>${judged}/${b.length} ${t('judged')}</small>`;
    d.onclick = () => { selBatch = i; renderBatches(); };
    box.appendChild(d);
  });
  $('#batchInfo').textContent = bs.length ? `${t('batch_sel')} ${selBatch + 1} ${t('of')} ${bs.length} · ${bs[selBatch].length} ${t('tweets')} · ${judgedAll.toLocaleString()} ${t('judged')}, ${(candidates.length - judgedAll).toLocaleString()} ${t('unjudged')}` : '';
  $('#copyBatch').disabled = !bs.length;
  $('#n4').classList.toggle('done', candidates.length > 0 && judgedAll === candidates.length);
}
function batchText(b) {
  const rubric = S.rubric.replace('{{PROFILE}}', S.profile.trim() || '(no profile given)');
  const lines = b.map(tw => `${tw.id} | ${date(tw).toISOString().slice(0, 10)} | ♥${fav(tw)} | ${text(tw).replace(/\s+/g, ' ')}`);
  return `${rubric}

=== TASK ===
Below are ${b.length} tweets, one per line: id | date | likes | text.
For EVERY tweet, reply with exactly one line in this format and nothing else:
<id> <keep|delete> <category> <short reason only if keep>
Example:
123456789 keep achievement selected for a residency
123456790 delete casual
Do not skip any id. Do not add commentary before or after.

=== TWEETS ===
${lines.join('\n')}`;
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); toast(t('copied')); return true; }
  catch { const ta = el('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? t('copied') : t('copy_fail')); return ok; }
}
$('#copyBatch').onclick = () => { const bs = batches(); if (bs.length) copyText(batchText(bs[selBatch])); };
function parseReply(s) {
  const out = {}; let unknown = 0;
  const known = new Set(candidates.map(tw => tw.id));
  for (let line of s.split('\n')) {
    line = line.trim(); if (!line) continue;
    let m;
    if (line.startsWith('{')) { try { const o = JSON.parse(line.replace(/,$/, '')); if (o.id) { out[String(o.id)] = { d: o.d === 'keep' ? 'keep' : 'delete', c: o.c || (o.d === 'keep' ? 'announce' : 'other'), r: o.r || '' }; continue; } } catch {} }
    // separators are limited to ASCII punctuation/space: \W would swallow non-Latin reasons (Japanese etc.)
    m = line.match(/^[\s\-*#|,:;."']*(\d{6,})[\s|,:;\-]*(keep|delete)\b[\s|,:;\-]*([A-Za-z_]+)?[\s|,:;\-]*(.*)$/i);
    if (!m) { if (/\d{6,}/.test(line)) unknown++; continue; }
    const [, id, d, c, r] = m;
    if (!known.has(id)) { unknown++; continue; }
    const dd = d.toLowerCase();
    let cc = (c || '').toLowerCase();
    if (dd === 'keep' && !KEEP_CATS.has(cc)) cc = 'announce';
    if (dd === 'delete' && (KEEP_CATS.has(cc) || !cc)) cc = 'other';
    out[id] = { d: dd, c: cc, r: dd === 'keep' ? (r || '').trim().slice(0, 60) : '' };
  }
  return { out, unknown };
}
$('#applyPaste').onclick = () => {
  const { out, unknown } = parseReply($('#pasteBox').value);
  const n = Object.keys(out).length;
  if (!n) { toast(`0 ${t('applied')} — ${unknown} ${t('unknown_ids')}`); return; }
  Object.assign(S.ai, out); save();
  $('#pasteBox').value = '';
  $('#pasteInfo').textContent = `${n} ${t('applied')}${unknown ? ` · ${unknown} ${t('unknown_ids')}` : ''}`;
  // advance to the next unfinished batch
  const bs = batches(); const next = bs.findIndex((b, i) => i > selBatch && b.some(tw => !S.ai[tw.id])); if (next >= 0) selBatch = next;
  renderAll();
};
$('#clearAi').onclick = () => { if (!Object.keys(S.ai).length) return; if (!confirm(t('clear_ai') + '?')) return; S.ai = {}; save(); renderAll(); };

// ─────────────────────────────────────────────────────────────
//  step 5: review
// ─────────────────────────────────────────────────────────────
function renderReview() {
  const cnt = { keep: 0, delete: 0, skip: 0 };
  for (const tw of tweets) cnt[decisionOf(tw)]++;
  $('#counts').innerHTML = `<span>${t('st_keep')} <b class="k">${cnt.keep.toLocaleString()}</b></span><span>${t('st_delete')} <b class="d">${cnt.delete.toLocaleString()}</b></span><span>${t('st_skip')} <b class="s">${cnt.skip.toLocaleString()}</b></span>`;
  const st = $('#stats'); st.innerHTML = '';
  [['keep', 'st_keep'], ['delete', 'st_delete'], ['skip', 'st_skip'], ['', 'st_all']].forEach(([d, k]) => {
    const s = el('div', `stat ${d} ${view.d === d ? 'on' : ''}`, `${t(k)}<b>${(d ? cnt[d] : tweets.length).toLocaleString()}</b>`);
    s.onclick = () => { view.d = d; view.page = 0; renderReview(); }; st.appendChild(s);
  });
  const years = {}; for (const tw of tweets) { const y = date(tw).getFullYear(); years[y] = years[y] || { k: 0, n: 0 }; years[y].n++; if (decisionOf(tw) === 'keep') years[y].k++; }
  const ys = Object.keys(years).sort(); const maxN = Math.max(...ys.map(y => years[y].n));
  const yb = $('#yearbar'); yb.innerHTML = '';
  ys.forEach(y => {
    const d = el('div', view.year === y ? 'on' : ''); d.style.height = `${Math.max(4, years[y].n / maxN * 100)}%`;
    const k = el('i'); k.style.height = `${years[y].k / years[y].n * 100}%`; d.appendChild(k); d.appendChild(el('span', '', y.slice(2)));
    d.title = `${y}: ${t('st_keep')} ${years[y].k} / ${years[y].n}`;
    d.onclick = () => { view.year = view.year === y ? '' : y; view.page = 0; renderReview(); }; yb.appendChild(d);
  });
  // category select
  const cats = [...new Set(tweets.map(categoryOf))].sort(); const sel = $('#cat'); const cur = view.cat;
  sel.innerHTML = `<option value="">${t('cat_all')}</option>` + cats.map(c => `<option value="${c}" ${c === cur ? 'selected' : ''}>${esc(catName(c))}</option>`).join('');

  const q = view.q.trim().toLowerCase();
  let list = tweets.filter(tw => {
    if (view.d && decisionOf(tw) !== view.d) return false;
    if (view.cat && categoryOf(tw) !== view.cat) return false;
    if (view.year && String(date(tw).getFullYear()) !== view.year) return false;
    const r = rules.get(tw.id); const ai = r.d === 'review' && S.ai[tw.id]; const ov = S.overrides[tw.id];
    if (view.src === 'ai' && !ai) return false;
    if (view.src === 'rule' && (ai || ov)) return false;
    if (view.src === 'manual' && !ov) return false;
    if (q && !text(tw).toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a, b) => (idLT(a.id, b.id) ? -1 : 1) * (view.desc ? -1 : 1));
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); view.page = Math.min(view.page, pages - 1);
  const box = $('#list'); box.innerHTML = '';
  const slice = list.slice(view.page * PAGE, (view.page + 1) * PAGE);
  if (!slice.length) box.appendChild(el('div', 'empty', t('nothing')));
  slice.forEach(tw => box.appendChild(card(tw, q)));
  const pg = $('#pager'); pg.innerHTML = '';
  const prev = el('button', 'btn small', '←'); prev.disabled = view.page === 0; prev.onclick = () => { view.page--; renderReview(); $('#s5').scrollIntoView(); };
  const next = el('button', 'btn small', '→'); next.disabled = view.page >= pages - 1; next.onclick = () => { view.page++; renderReview(); $('#s5').scrollIntoView(); };
  pg.appendChild(prev); pg.appendChild(el('span', '', `${list.length.toLocaleString()} · ${view.page + 1} / ${pages}`)); pg.appendChild(next);
  $('#n5').classList.toggle('done', tweets.length > 0);
  $('#n6').classList.toggle('done', false);
}
function linkify(s, q) {
  let h = esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  if (q) h = h.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
  return h;
}
function card(tw, q) {
  const d = decisionOf(tw), c = categoryOf(tw), r = rules.get(tw.id), locked = LOCKED.has(r.c), ai = r.d === 'review' && S.ai[tw.id], ov = S.overrides[tw.id];
  const art = el('article', `tweet ${d} ${ov ? 'overridden' : ''}`);
  const left = el('div');
  left.appendChild(el('div', 'meta',
    `<span>${date(tw).toISOString().slice(0, 10)}</span>` +
    `<span class="cat ${d === 'keep' ? 'k' : ''} ${locked ? 'lock' : ''}">${locked ? '🔒 ' : ''}${esc(catName(c))}</span>` +
    `<span>${ai ? 'AI' : t('rule')}</span>` + (ov ? `<span style="color:var(--accent)">${t('manual')}</span>` : '') +
    `<span>♥ ${fav(tw)} · ⟲ ${rtc(tw)}</span>` + (ai && ai.r ? `<span class="reason">${esc(ai.r)}</span>` : '') +
    `<a href="https://x.com/i/status/${tw.id}" target="_blank" rel="noopener noreferrer">${t('open')}</a>`));
  left.appendChild(el('div', 'text', linkify(text(tw), q)));
  const m = media(tw); if (m.length) left.appendChild(el('div', 'meta', m.map(x => `<a href="${esc(x.media_url_https || x.media_url || '')}" target="_blank" rel="noopener noreferrer">🖼 ${esc(x.type || 'media')}</a>`).join('')));
  art.appendChild(left);
  const act = el('div', 'act');
  const bk = el('button', d === 'keep' ? 'on-keep' : '', t('keep')); const bd = el('button', d === 'delete' ? 'on-del' : '', t('delete'));
  if (locked) { bk.disabled = bd.disabled = true; bk.title = bd.title = t('locked_tip'); }
  const base = () => { const rr = rules.get(tw.id); return rr.d !== 'review' ? rr.d : (S.ai[tw.id] ? S.ai[tw.id].d : 'delete'); };
  bk.onclick = () => { if (base() === 'keep') delete S.overrides[tw.id]; else S.overrides[tw.id] = 'keep'; save(); renderReview(); };
  bd.onclick = () => { if (base() === 'delete') delete S.overrides[tw.id]; else S.overrides[tw.id] = 'delete'; save(); renderReview(); };
  act.appendChild(bk); act.appendChild(bd); art.appendChild(act);
  return art;
}
let qt2;
$('#q').oninput = e => { clearTimeout(qt2); qt2 = setTimeout(() => { view.q = e.target.value; view.page = 0; renderReview(); }, 180); };
$('#cat').onchange = e => { view.cat = e.target.value; view.page = 0; renderReview(); };
$('#src').onchange = e => { view.src = e.target.value; view.page = 0; renderReview(); };
$('#sort').onclick = () => { view.desc = !view.desc; $('#sort').textContent = view.desc ? t('newest') : t('oldest'); renderReview(); };
$('#resetOv').onclick = () => { if (!Object.keys(S.overrides).length) return; if (!confirm(t('reset_confirm'))) return; S.overrides = {}; save(); renderReview(); };

// ─────────────────────────────────────────────────────────────
//  step 6: export + deleter
// ─────────────────────────────────────────────────────────────
function download(obj, name) {
  const a = el('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#exportList').onclick = () => {
  const del = [], keep = [];
  for (const tw of tweets) {
    const d = decisionOf(tw); const o = { id: tw.id, date: date(tw).toISOString().slice(0, 10), c: categoryOf(tw) };
    if (d === 'delete') del.push({ ...o, text: text(tw).slice(0, 60) });
    else if (d === 'keep') keep.push({ ...o, text: text(tw), r: (S.ai[tw.id] || {}).r || '' });
  }
  del.sort((a, b) => idLT(a.id, b.id) ? -1 : 1);
  const gen = new Date().toISOString();
  download({ generated: gen, pivot_id: effectivePivot(), count: del.length, keep_count: keep.length, ids: del }, 'delete_list.json');
  setTimeout(() => download({ generated: gen, count: keep.length, items: keep }, 'keep_list.json'), 400);
  $('#n6').classList.add('done');
  toast(`${t('exported')} (${del.length.toLocaleString()} / ${keep.length.toLocaleString()})`);
};
$('#copyDeleter').onclick = async () => {
  try { const r = await fetch('deleter.js'); if (!r.ok) throw 0; copyText(await r.text()); }
  catch { toast(t('copy_fail')); }
};

// ─────────────────────────────────────────────────────────────
//  boot
// ─────────────────────────────────────────────────────────────
function renderAll() { runRules(); renderPivot(); renderRules(); renderBatches(); renderReview(); }
load();
bindSettings();
applyLang();
})();
</script>
